<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kalou BTP</title>
    <meta name="description" content="Calculs de chantier pour la maçonnerie : quantités de matériaux, maison neuve, listes de courses.">
    <meta name="theme-color" content="#1A1A1A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Kalou BTP">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header class="topbar" id="topbar"></header>

    <main id="vue"></main>

    <div class="actionbar hidden" id="actionbar"></div>

    <nav class="tabbar" aria-label="Menu principal">
        <button class="tab" data-tab="calculs"   data-href="#/"          data-icon="calc"     data-label="Calculs"></button>
        <button class="tab" data-tab="maison"    data-href="#/maison"    data-icon="maison"   data-label="Maison"></button>
        <button class="tab" data-tab="chantiers" data-href="#/chantiers" data-icon="chantier" data-label="Chantiers"></button>
        <button class="tab" data-tab="reglages"  data-href="#/reglages"  data-icon="reglages" data-label="Réglages"></button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript><p style="padding:20px">Active JavaScript pour utiliser Kalou BTP.</p></noscript>
    <script type="module" src="js/app.js"></script>
</body>
</html>
